title: qcreport
author: Qiong Chen
version: 1.1.0
quarto-required: ">=1.8.24"
contributes:
  formats:
    typst:
      par-leading: 1.3em
      par-spacing: 1.6em
      first-line-indent: 2em
      table-leading: 0.7em
      tablefont: "STSong"
      tablescriptfont: "PingFang SC"
      cover-bg-opacity: 60%
      body-bg-opacity: 40%
      format-resources:
        - _assets/
      template-partials:
        - typst-template.typ
        - typst-show.typ
